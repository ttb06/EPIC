# LLaDA-Rec backbone defaults. Publication recipes in configs/ override these.
metadata: sentence
tokenizer_name: MultiHeadVQVAE

lr: 0.003
weight_decay: 0.05
max_item_seq_len: 20
train_min_history_len: 1
train_max_history_len: 0

dropout_rate: 0.1
activation_type: silu
bias_for_layer_norm: false
block_type: llama
d_model: 256
mlp_ratio: 4
init_fn: mitchell
layer_norm_type: rms
n_heads: 4
n_kv_heads: 4
n_layers: 4
rope: false
rope_theta: 500000.0
weight_tying: false
his_mask_w: 1.0

gen_steps: 4
val_num_beams: 5
num_beams: 50
temperature: 1.0
val_topk: [5]
val_metric: ndcg@5
evaluation_target: item

# Base LLaDA-Rec path.
masking_strategy: token
structured_mask_prob: 0.25
soft_diffusion_mode: "off"
soft_diffusion_strength: 0.35
soft_diffusion_prob: 0.5
soft_diffusion_neighbors: 4
soft_view_consistency_w: 0.0
soft_view_temperature: 1.0
structured_attention_mode: flat
use_hierarchy_embedding: false
tuple_consistency_w: 0.0
tuple_constrained_decode: false
subset_resolved_decode: false
subset_resolved_tokens: 3
subset_completion_score_weight: 1.0
subset_transfer_policy: confidence
subset_adaptive_bucket_threshold: 0
subset_catalog_preselection_fusion: false
catalog_item_loss_w: 0.0
catalog_item_loss_mode: full
catalog_item_loss_topk: 128
catalog_item_loss_temperature: 1.0
catalog_item_loss_min_masked: 1
catalog_item_loss_max_masked: 0
catalog_item_loss_focal_gamma: 0.0
catalog_decode_mode: beam
catalog_decode_weight: 0.25
catalog_decode_digit_weight: uniform
catalog_score_normalization: none
catalog_decode_weight_mode: fixed
catalog_decode_weight_min: 0.25
catalog_decode_weight_max: 0.25
trainable_parameter_mode: all

# EPIC is opt-in; configs/epic/*.yaml activates this branch.
item_arch_mode: "off"
item_arch_loss_w: 0.0
item_arch_candidate_topk: 128
item_arch_temperature: 0.1
item_arch_hidden_dim: 128
item_arch_feedback_strength: 0.25
item_arch_decode_weight: -1.0
item_arch_feedback_clip: 8.0
item_arch_gate_hidden: 32
item_arch_gate_mode: learned
item_arch_compatible_only: true
item_arch_score_chunk_size: 64
item_arch_tuple_mode: pairwise
item_arch_score_mode: dot
item_arch_transition_mode: recent_attn
item_arch_transition_recent_k: 8
item_arch_transition_attention_temperature: 0.25
item_arch_transition_route_mode: fixed
item_arch_transition_semantic_heads: 0
item_arch_pairwise_semantic_heads: 0
item_arch_loss_min_bucket: 2
item_arch_loss_max_bucket: 128
item_arch_loss_mode: listwise
item_arch_sid_kernel_w: 0.05
item_arch_sid_kernel_temperature: 0.1
item_arch_sid_kernel_semantic_heads: 0
item_arch_belief_mode: independent
item_arch_belief_weight: 0.25
item_arch_feedback_max_bucket: 0
item_arch_history_mode: gru
