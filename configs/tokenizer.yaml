cache_dir: cache/
base_result_dir: outputs/tokenizer/
tensorboard_log_dir: outputs/tensorboard/tokenizer/
run_id: semantic_id_tokenizer
rand_seed: 2024
reproducibility: true
tokenizer_name: MultiHeadVQVAE
