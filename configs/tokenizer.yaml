vqvae_epoch: 10000
vqvae_verbose: 50
vqvae_beta: 0.25
vqvae_sk_epsilon: 0.003
vqvae_sk_iters: 10
vqvae_quant_weight: 1.0
vqvae_bn: false
kmeans_init: true
kmeans_iters: 100
vqvae_save_method: collision
