category: Musical_Instruments
cache_dir: cache/
base_result_dir: outputs/epic/
tensorboard_log_dir: outputs/tensorboard/epic/
run_id: epic_musical
rand_seed: 2024
reproducibility: true
steps: 8000
epochs: 120
train_batch_size: 256
gradient_accumulation_steps: 2
eval_batch_size: 128
test_batch_size: 20
lr: 0.001
weight_decay: 0.01
warmup_ratio: 0.05
eval_interval: 2
patience: 16
d_model: 256
n_layers: 4
n_heads: 4
n_kv_heads: 4
his_mask_w: 3.5
temperature: 0.3
sent_emb_model: text-embedding-3-large
sent_emb_dim: 3072
sent_emb_pca: 128
soft_diffusion_mode: tuple_simplex
soft_diffusion_strength: 0.35
soft_diffusion_prob: 0.5
soft_diffusion_neighbors: 4
soft_view_consistency_w: 0.05
subset_resolved_decode: true
subset_resolved_tokens: 3
subset_catalog_preselection_fusion: true
catalog_decode_mode: hybrid
catalog_decode_weight: 0.25
catalog_decode_weight_mode: disagreement_confidence
catalog_decode_weight_min: 0.1
catalog_decode_weight_max: 0.6
trainable_parameter_mode: item_arch_only
init_checkpoint_strict: false
item_arch_mode: epic
item_arch_loss_w: 0.05
item_arch_candidate_topk: 256
item_arch_temperature: 0.1
item_arch_hidden_dim: 128
item_arch_feedback_strength: 0.25
item_arch_tuple_mode: pairwise
item_arch_transition_mode: recent_attn
item_arch_transition_recent_k: 8
item_arch_transition_attention_temperature: 0.25
item_arch_loss_min_bucket: 2
item_arch_loss_max_bucket: 256
item_arch_sid_kernel_w: 0.05
item_arch_sid_kernel_temperature: 0.1
item_arch_history_mode: gru
evaluation_target: item
